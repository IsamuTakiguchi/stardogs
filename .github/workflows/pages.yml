name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the site files
        run: |
          for f in index.html manifest.webmanifest sw.js vendor/three.min.js icons/icon-192.png icons/icon-512.png icons/icon-maskable-192.png icons/icon-maskable-512.png icons/apple-touch-icon.png icons/apple-touch-icon-167.png icons/apple-touch-icon-152.png icons/favicon-32.png; do
            test -f "public/$f" || { echo "missing public/$f"; exit 1; }
          done
          node --check public/sw.js
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8'))"

      # A new cache name per deploy makes installed apps pick up the update.
      - name: Stamp service worker version
        run: sed -i "s/const VERSION = 'stardogs-v1';/const VERSION = 'stardogs-${GITHUB_SHA::8}';/" public/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
